<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="32" viewBox="0 0 1000 32" role="img" aria-label=""><style>.date{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#8b949e;letter-spacing:.4px}.title{font:700 16px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#e6edf3}.org{font:400 15px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8b949e}.kind{font:600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1.4px}.ptitle{font:500 14px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#c9d1d9}.venue{font:500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#8b949e;letter-spacing:.3px}.go{font:600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7ee0d2;letter-spacing:.6px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}</style><path d="M0.5 32 V16 Q0.5 0.5 16 0.5 H984 Q999.5 0.5 999.5 16 V32" fill="#0d1117" stroke="#30363d"/></svg>