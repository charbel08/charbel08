<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Charbel El Feghali, ML researcher. Animated weight matrix unscrambling when a key is applied."><style>
  .name { font: 700 40px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: -0.5px; }
  .role { font: 400 17px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
  .tag  { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; letter-spacing: 1.2px; }
  .col  { animation: unscramble 9s cubic-bezier(.65,0,.35,1) infinite; }
  .key  { animation: sweep 9s ease-in-out infinite; }
  .lbl-pub { animation: pub 9s step-end infinite; }
  .lbl-key { opacity: 0; animation: keyed 9s step-end infinite; }
  @keyframes sweep {
    0%, 22% { transform: translateX(0); opacity: 0; }
    24% { opacity: 1; }
    40% { transform: translateX(250px); opacity: 1; }
    42%, 100% { transform: translateX(250px); opacity: 0; }
  }
  @keyframes pub   { 0% { opacity: 1; } 44% { opacity: 0; } 88% { opacity: 1; } }
  @keyframes keyed { 0% { opacity: 0; } 44% { opacity: 1; } 88% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .col, .key, .lbl-pub, .lbl-key { animation: none; }
    .key, .lbl-pub { opacity: 0; }
    .lbl-key { opacity: 1; }
  }
